<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="じまんクイズ">
<meta name="theme-color" content="#3DB4E0">
<meta name="format-detection" content="telephone=no">
<title>宜野湾のじまん たんけんクイズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* =========================================================
   宜野湾のじまん たんけんクイズ
   第37回 宜野湾市産業まつり 出展用（iPad 想定・1ファイル完結）
   ---------------------------------------------------------
   デザインの軸
   ・背景は「湧き水の波紋」。カードは輪郭線のあるステッカー調。
   ・正解するたびに田んぼに田芋・ハスが育つ（進み具合の表示）。
   ・見出しは Mochiy Pop One、本文は Zen Maru Gothic。
   ========================================================= */
:root{
  --ink:#1E2B44; --ink-2:#4F5E78; --mute:#DCE4EC;
  --aqua:#1D9BCB; --aqua-top:#3DB4E0; --aqua-d:#0B6F9C; --aqua-l:#DDF4FB;
  --leaf:#3BA55C; --leaf-d:#22703A; --leaf-l:#DFF4E5;
  --lotus:#EF5C8E; --lotus-l:#FDE4EE;
  --sun:#FFC83A; --sun-l:#FFF3CF;
  --earth:#A9743F; --flesh:#FFF7E8; --hole:#E9CFA6;
  --ok:#2FAE5A; --ok-l:#DDF5E4; --ng:#EF4D5A; --ng-l:#FDE3E5;
  --lv:#1D9BCB; --lv-l:#DDF4FB; --lv-t:#fff;
  --pop:"Mochiy Pop One","Hiragino Maru Gothic ProN","Zen Maru Gothic",sans-serif;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  --card-sh:0 10px 0 rgba(8,55,85,.32);
  --outline:3px 0 0 var(--ink),-3px 0 0 var(--ink),0 3px 0 var(--ink),0 -3px 0 var(--ink),2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink);
}
body[data-level="easy"]  {--lv:#3BA55C;--lv-l:#DFF4E5;--lv-t:#fff}
body[data-level="normal"]{--lv:#1E7FD8;--lv-l:#DCEBFB;--lv-t:#fff}
body[data-level="hard"]  {--lv:#F59A2C;--lv-l:#FFEBD3;--lv-t:#1E2B44}
body[data-level="oni"]   {--lv:#D7263D;--lv-l:#FCE0E4;--lv-t:#fff}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--aqua)}
body{
  font-family:var(--body);font-weight:700;color:var(--ink);
  background-color:var(--aqua);
  background-image:
    repeating-radial-gradient(circle at 50% 150px,rgba(255,255,255,.14) 0 3px,rgba(255,255,255,0) 3px 58px),
    linear-gradient(180deg,var(--aqua-top) 0%,var(--aqua) 48%,#178BBE 100%);
  min-height:100vh;min-height:100dvh;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  overscroll-behavior:none;-webkit-text-size-adjust:100%;touch-action:manipulation;
}
body[data-level="oni"]{
  background-color:#262A50;
  background-image:
    repeating-radial-gradient(circle at 50% 150px,rgba(255,255,255,.06) 0 3px,rgba(255,255,255,0) 3px 58px),
    linear-gradient(180deg,#262A50 0%,#2E2049 55%,#3A1B3E 100%);
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
button[disabled]{cursor:default}
svg{display:block}
ruby rt{font-size:.46em;font-weight:700;letter-spacing:0}
.hidden{display:none!important}
.on-water{color:#fff;text-shadow:0 2px 0 rgba(20,40,70,.45)}

.screen{display:none;min-height:100vh;min-height:100dvh;
  padding:max(18px,env(safe-area-inset-top)) 22px max(26px,env(safe-area-inset-bottom))}
.screen.active{display:block}
.wrap{max-width:940px;margin:0 auto}

/* ---------- ボタン ---------- */
.press{border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink);transition:transform .06s}
.press:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.press[disabled]:active{transform:none;box-shadow:0 6px 0 var(--ink)}
.go-btn{min-height:72px;padding:0 46px;border-radius:999px;background:var(--sun);font-family:var(--pop);font-size:26px;letter-spacing:.04em}
.go-btn[disabled]{background:var(--mute);color:#8A97AA}
.sub-btn{min-height:62px;padding:0 24px;border-radius:999px;background:#fff;font-size:20px;font-weight:900}
.sub-btn[disabled]{color:#9AA6B6;background:#F2F5F8}
.sub-btn.big{min-height:72px;padding:0 34px;font-family:var(--pop);font-weight:400;font-size:22px}
.pill{display:inline-flex;align-items:center;gap:8px;min-height:52px;padding:0 18px;border-radius:999px;background:#fff;font-size:18px;font-weight:900;white-space:nowrap}
.pill svg{width:24px;height:24px}
.icon-btn{width:56px;height:56px;border-radius:50%;background:#fff;display:grid;place-items:center}
.icon-btn svg{width:28px;height:28px}

/* ---------- 田んぼ（すすみぐあい） ---------- */
.strip{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;padding:6px 10px 8px;
  background:var(--earth);border:3px solid var(--ink);border-radius:20px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.14)}
.plot{position:relative;border-radius:10px}
.plot svg{width:100%;height:auto;overflow:visible}
.plot.now{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--ink);animation:bob 1.3s ease-in-out infinite}
.plot .plant{transform-box:fill-box;transform-origin:50% 100%}
.plot.grow .plant{animation:grow .75s cubic-bezier(.3,1.6,.5,1) both}
.plot.grow .mudfill{animation:fade .5s ease-out both}
@keyframes grow{0%{transform:scale(0)}100%{transform:scale(1)}}
@keyframes fade{0%{opacity:0}100%{opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

/* ---------- タイトル ---------- */
.title-wrap{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
.brand,.menu{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.ribbon{display:inline-flex;align-items:center;gap:10px;padding:8px 22px;border-radius:999px;background:#fff;border:3px solid var(--ink);
  font-family:var(--pop);font-size:17px;letter-spacing:.06em}
.ribbon i{width:12px;height:12px;border-radius:50%;background:var(--sun);border:2px solid var(--ink)}
.title{font-family:var(--pop);font-weight:400;color:#fff;font-size:clamp(46px,7.6vw,88px);line-height:1.22;letter-spacing:.03em;margin-top:4px;
  text-shadow:4px 0 0 var(--ink),-4px 0 0 var(--ink),0 4px 0 var(--ink),0 -4px 0 var(--ink),3px 3px 0 var(--ink),-3px 3px 0 var(--ink),3px -3px 0 var(--ink),-3px -3px 0 var(--ink),
    4px 2px 0 var(--ink),-4px 2px 0 var(--ink),2px 4px 0 var(--ink),-2px 4px 0 var(--ink),4px -2px 0 var(--ink),-4px -2px 0 var(--ink),2px -4px 0 var(--ink),-2px -4px 0 var(--ink),
    0 10px 0 var(--ink)}
.title rt{font-size:.28em;letter-spacing:.1em;text-shadow:var(--outline)}
.title .l2{display:block;font-size:.74em}
.lead{font-size:clamp(19px,2.4vw,23px);line-height:1.9;font-weight:900}
.hero{width:100%;max-width:880px;display:grid;gap:4px;margin-top:2px}
.hero-talk{display:flex;align-items:flex-end;justify-content:center;gap:12px}
.hero-mascot svg{width:96px;height:auto;animation:bob 2.6s ease-in-out infinite}
.bubble{position:relative;background:#fff;border:3px solid var(--ink);border-radius:22px;padding:10px 20px;margin-bottom:22px;
  font-size:clamp(17px,2.1vw,21px);line-height:1.75;font-weight:900;text-align:left;box-shadow:0 6px 0 rgba(8,55,85,.32)}
.bubble::before{content:"";position:absolute;left:-15px;bottom:18px;border:9px solid transparent;border-right:13px solid var(--ink)}
.bubble::after{content:"";position:absolute;left:-9px;bottom:20px;border:7px solid transparent;border-right:9px solid #fff}
.pick{font-family:var(--pop);font-weight:400;color:#fff;font-size:clamp(22px,2.8vw,28px);margin-top:10px;text-shadow:var(--outline),0 5px 0 var(--ink)}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;width:100%;max-width:900px;margin-top:4px}
.lv-btn{--c:#3BA55C;--cl:#DFF4E5;display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 10px 16px;border-radius:26px;
  background:linear-gradient(180deg,var(--cl) 0 44%,#fff 44%)}
.lv-btn .ic{width:88px;height:88px;border-radius:50%;background:#fff;border:3px solid var(--ink);display:grid;place-items:center}
.lv-btn .ic svg{width:62px;height:62px}
.lv-btn .nm{font-family:var(--pop);font-size:clamp(21px,2.6vw,28px);line-height:1.45;margin-top:2px}
.lv-btn .nm rt{font-size:.42em}
.lv-btn .who{font-size:14px;line-height:1.8;color:var(--ink-2)}
.lv-btn .pips{display:flex;gap:4px;margin-top:2px}
.lv-btn .pips svg{width:16px;height:20px}
.lv-btn[data-lv="normal"]{--c:#1E7FD8;--cl:#DCEBFB}
.lv-btn[data-lv="hard"]{--c:#F59A2C;--cl:#FFEBD3}
.lv-btn[data-lv="oni"]{--c:#D7263D;--cl:#FCE0E4}
.title-foot{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;margin-top:12px}
.tip{font-size:17px;font-weight:900}

/* ---------- クイズ ---------- */
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.lv-tag{display:inline-flex;align-items:center;gap:8px;min-height:52px;padding:0 18px 0 8px;border-radius:999px;background:var(--lv);color:var(--lv-t);
  border:3px solid var(--ink);font-family:var(--pop);font-size:20px}
.lv-tag .ic{width:36px;height:36px;border-radius:50%;background:#fff;border:2px solid var(--ink);display:grid;place-items:center}
.lv-tag .ic svg{width:26px;height:26px}
.count{margin-left:auto;font-family:var(--pop);font-size:30px;color:#fff;text-shadow:var(--outline),0 4px 0 var(--ink);letter-spacing:.04em}
.count small{font-size:.6em}
#strip{margin-bottom:30px}
.qcard{position:relative;background:#fff;border:3px solid var(--ink);border-radius:30px;padding:30px 28px 18px;box-shadow:var(--card-sh)}
.qcard.enter{animation:pop .35s ease-out}
.qcard.shake{animation:shake .45s}
@keyframes pop{0%{transform:scale(.97);opacity:.4}100%{transform:none;opacity:1}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.qno{position:absolute;top:-22px;left:22px;display:inline-flex;align-items:center;padding:4px 18px;border-radius:999px;background:var(--lv);color:var(--lv-t);
  border:3px solid var(--ink);font-family:var(--pop);font-size:19px}
.qmeta{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.qtype{border:2px solid var(--ink);border-radius:999px;padding:3px 14px;font-size:16px;font-weight:900;background:var(--lv-l)}
.read-btn{margin-left:auto;display:inline-flex;align-items:center;gap:6px;min-height:48px;padding:0 16px;border-radius:999px;background:#fff;
  border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);font-size:17px;font-weight:900}
.read-btn svg{width:24px;height:24px}
.read-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.qtext{font-size:clamp(22px,3.1vw,32px);line-height:1.8;font-weight:900;letter-spacing:.02em}
body[data-level="easy"] .opt,body[data-level="easy"] .exp,body[data-level="easy"] .answer-text,body[data-level="easy"] .res-msg,body[data-level="easy"] .rv-q{word-break:keep-all;overflow-wrap:anywhere}
body[data-level="easy"] .qtext{font-size:clamp(25px,3.6vw,37px);line-height:1.9;word-break:keep-all;overflow-wrap:anywhere}
.howto{margin-top:6px;font-size:17px;color:var(--ink-2)}
.blank{display:inline-block;min-width:4.6em;padding:0 .4em;margin:0 .1em;border:3px dashed var(--ink);border-radius:12px;background:var(--lv-l);
  text-align:center;line-height:1.45}
.blank.ok{border-style:solid;background:var(--ok-l)}

.answers{margin-top:24px}
.grid{display:grid;gap:16px}
.grid.c2{grid-template-columns:1fr 1fr}
.grid.c3{grid-template-columns:repeat(3,1fr)}
.opt{position:relative;min-height:88px;padding:14px 18px;background:#fff;border-radius:22px;
  font-size:clamp(19px,2.5vw,25px);font-weight:900;line-height:1.55;text-align:center;display:flex;align-items:center;justify-content:center;gap:12px}
.opt.sel{background:var(--lv-l)}
.opt.ok{background:var(--ok-l)}
.opt.ng{background:var(--ng-l)}
.opt.dim{opacity:.45}
.opt .mark{position:absolute;top:-16px;right:-12px;width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);display:none;place-items:center;color:#fff}
.opt .mark svg{width:24px;height:24px}
.opt.ok .mark{display:grid;background:var(--ok)}
.opt.ng .mark{display:grid;background:var(--ng)}
.sw{flex:none;width:34px;height:34px;border-radius:50%;border:3px solid var(--ink)}
.multi .opt{justify-content:flex-start;text-align:left;padding-left:64px}
.multi .chk{position:absolute;left:18px;top:50%;width:32px;height:32px;margin-top:-16px;border-radius:9px;border:3px solid var(--ink);background:#fff;display:grid;place-items:center;color:#fff}
.multi .chk svg{width:22px;height:22px;opacity:0}
.multi .opt.sel .chk{background:var(--lv)}
.multi .opt.sel .chk svg{opacity:1}

.ox{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.ox .opt{min-height:210px;flex-direction:column;gap:6px}
.ox .opt svg.sym{width:min(128px,26vw);height:auto}
.ox .lbl{font-family:var(--pop);font-weight:400;font-size:24px}

.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:20px}
.slot{min-width:66px;height:76px;padding:0 10px;border:3px dashed #9AAABE;border-radius:16px;display:grid;place-items:center;
  font-family:var(--pop);font-size:32px;background:#F6F9FC}
.slot.filled{border:3px solid var(--ink);background:var(--flesh)}
.slots.many .slot{min-width:54px;height:66px;font-size:26px;padding:0 6px}
.slots.ok .slot{background:var(--ok-l)}
.slots.ng .slot{background:var(--ng-l)}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.tile{position:relative;min-width:76px;height:80px;padding:0 14px;border-radius:18px;background:var(--flesh);font-family:var(--pop);font-size:32px}
.tile::after{content:"";position:absolute;right:7px;top:7px;width:9px;height:9px;border-radius:50%;background:var(--hole)}
.tile.used{visibility:hidden}
.tiles.many{gap:10px}
.tiles.many .tile{min-width:64px;height:70px;padding:0 10px;font-size:28px}
.grid.order.c3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.order .opt{justify-content:flex-start;text-align:left;padding-left:70px;min-height:78px}
.order .badge{position:absolute;left:16px;top:50%;width:40px;height:40px;margin-top:-20px;border-radius:50%;border:3px dashed #9AAABE;
  display:grid;place-items:center;font-family:var(--pop);font-size:20px;color:var(--lv-t)}
.order .opt.sel .badge{border:3px solid var(--ink);background:var(--lv)}
.order .opt.ok .badge{border:3px solid var(--ink);background:var(--ok);color:#fff}
.order .opt.ng .badge{border:3px solid var(--ink);background:var(--ng);color:#fff}
.ctrls{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:24px;flex-wrap:wrap}

.numwrap{display:grid;gap:18px;justify-items:center}
.numleft{display:grid;gap:18px;justify-items:center}
.numdisp{display:flex;align-items:baseline;justify-content:flex-end;gap:10px;width:min(440px,86vw);min-height:92px;padding:10px 24px;
  background:#fff;border:3px solid var(--ink);border-radius:22px;box-shadow:inset 0 5px 0 rgba(30,43,68,.08);font-family:var(--pop);font-size:46px}
.numdisp .ph{color:#B7C4D3}
.numdisp .unit{font-family:var(--body);font-size:26px;font-weight:900;color:var(--ink-2)}
.numdisp.ok{background:var(--ok-l)}
.numdisp.ng{background:var(--ng-l)}
.keypad{display:grid;grid-template-columns:repeat(3,100px);gap:12px}
.key{height:70px;border-radius:18px;background:#fff;font-family:var(--pop);font-size:30px;display:grid;place-items:center}
.key svg{width:32px;height:32px}
.key.bs{background:#EEF3F8}
@media (orientation:landscape) and (min-width:900px){
  .numwrap{grid-template-columns:auto auto;align-items:center;justify-content:center;column-gap:48px}
}

/* ---------- 答えシート ---------- */
.scrim{position:fixed;inset:0;background:rgba(14,30,52,.42);opacity:0;pointer-events:none;transition:opacity .3s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:min(960px,100%);transform:translate(-50%,112%);
  z-index:50;background:#fff;border:3px solid var(--ink);border-bottom:0;
  border-radius:32px 32px 0 0;max-height:82vh;overflow:auto;-webkit-overflow-scrolling:touch;visibility:hidden;
  transition:transform .4s cubic-bezier(.2,.9,.3,1.08),visibility 0s linear .4s}
.sheet.on{transform:translate(-50%,0);visibility:visible;transition:transform .4s cubic-bezier(.2,.9,.3,1.08),visibility 0s}
.sheet-head{display:flex;align-items:center;gap:14px;padding:12px 24px;background:var(--ok);border-bottom:3px solid var(--ink)}
.sheet.ng .sheet-head{background:var(--ng)}
.sheet-mascot svg{width:76px;height:auto}
.verdict{font-family:var(--pop);font-size:44px;color:#fff;line-height:1.2;text-shadow:var(--outline),0 5px 0 var(--ink)}
.combo[hidden]{display:none}
.combo{display:inline-block;margin-top:6px;padding:3px 14px;border-radius:999px;background:var(--sun);border:2px solid var(--ink);font-size:17px;font-weight:900}
.sheet-head .read-btn{align-self:center}
.sheet-body{padding:18px 28px calc(24px + env(safe-area-inset-bottom))}
.answer-box{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:start;padding:12px 18px;border-radius:18px;background:#F2F6FA;border:2px solid #D4DEE8}
.answer-label{font-family:var(--pop);font-size:16px;padding:3px 12px;border-radius:999px;background:var(--ink);color:#fff;margin-top:6px;white-space:nowrap}
.answer-text{font-size:clamp(21px,2.8vw,27px);font-weight:900;line-height:1.65}
.exp{margin-top:14px;font-size:clamp(18px,2.3vw,22px);line-height:1.95;font-weight:700}
.next-btn{display:block;width:100%;margin-top:20px}

/* ---------- 結果 ---------- */
.res-head{text-align:center;font-family:var(--pop);font-weight:400;font-size:clamp(34px,5vw,50px);color:#fff;margin:6px 0 22px;
  text-shadow:var(--outline),0 7px 0 var(--ink)}
.res-top{display:grid;grid-template-columns:1.15fr 1fr;gap:22px;align-items:stretch}
.card{background:#fff;border:3px solid var(--ink);border-radius:28px;box-shadow:var(--card-sh)}
.field-box{padding:16px 18px 18px;display:flex;flex-direction:column;justify-content:center}
.field-label{font-family:var(--pop);font-size:20px;margin-bottom:10px;text-align:center}
.field-label rt{font-size:.42em}
.field{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;background:var(--earth);border:3px solid var(--ink);border-radius:18px;padding:10px 12px 12px}
.score-card{padding:16px 18px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}
.res-mascot svg{width:72px;height:auto}
.score{font-family:var(--pop);font-size:26px;line-height:1.1;margin-top:4px}
.score b{font-weight:400;font-size:80px;color:var(--lv);text-shadow:var(--outline);letter-spacing:.02em}
.stars{display:flex;gap:8px;margin-top:6px}
.stars svg{width:42px;height:42px}
.rank{display:inline-block;margin-top:10px;padding:6px 20px;border-radius:999px;background:var(--sun);border:3px solid var(--ink);
  font-family:var(--pop);font-size:clamp(18px,2.3vw,22px);line-height:1.7}
.rank rt{font-size:.45em}
.res-msg{font-size:18px;margin-top:10px;line-height:1.8}
.res-btns{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:30px 0 34px}

.modal{position:fixed;inset:0;z-index:80;background:rgba(14,30,52,.55);display:grid;place-items:center;padding:20px}

.modal-box{width:min(640px,100%);max-height:86vh;overflow:auto;background:#fff;border-radius:28px;padding:26px 26px 24px;
  border:3px solid var(--ink);box-shadow:0 10px 0 var(--ink);text-align:center}

.stats{width:100%;border-collapse:collapse;font-size:16px;margin-top:8px}
.stats th,.stats td{border-bottom:2px solid #E3ECF4;padding:8px 6px;text-align:center}
.stats th{color:var(--ink-2);font-size:14px}
.stats td small{display:block;color:var(--ink-2);font-size:12px}
.stats-note{font-size:14px;color:var(--ink-2);margin-top:10px;text-align:left}

.confetti{position:fixed;top:-60px;pointer-events:none;z-index:60;animation:fall linear forwards}

const recent = {easy:[], normal:[], hard:[], oni:[]};
function pickQuestions(lv, n){
  const bank = BANK[lv];
  const rec = new Set(recent[lv]);
  const pool = shuffle(bank.slice()).sort((a, b) => (rec.has(a.id) ? 1 : 0) - (rec.has(b.id) ? 1 : 0));
  const chosen = [], topics = new Set(), types = {};
  const passes = [{topic:true, type:true}, {topic:true, type:false}, {topic:false, type:false}];
  for (const p of passes){
    for (const q of pool){
      if (chosen.length >= n) break;
      if (chosen.indexOf(q) >= 0) continue;
      if (p.topic && topics.has(q.topic)) continue;
      if (p.type && (types[q.type] || 0) >= 4) continue;
      chosen.push(q); topics.add(q.topic); types[q.type] = (types[q.type] || 0) + 1;
    }
  }
  recent[lv] = chosen.map(q => q.id);
  return shuffle(chosen);
}
function prepare(q){
  const p = Object.assign({}, q);
  if (q.c) p.order = shuffle(q.c.map((_, i) => i));
  if (q.type === 'anagram'){
    let t, tries = 0;
    do { t = shuffle(q.tiles.map((_, i) => i)); tries++; }
    while (t.map(i => q.tiles[i]).join('') === q.tiles.join('') && tries < 40);
    p.tileOrder = t;
  }
  if (q.type === 'order'){
    let t, tries = 0;
    do { t = shuffle(q.steps.map((_, i) => i)); tries++; }
    while (t.every((v, i) => v === i) && tries < 40);
    p.stepOrder = t;
  }
  return p;
}

   ========================================================= */
let actx = null;
let soundOn = (() => { try { return localStorage.getItem('gq_sound') !== 'off'; } catch (e) { return true; } })();
function ensureAudio(){
  try {
    if (!actx){ const AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC(); }
    if (actx && actx.state === 'suspended') actx.resume();
  } catch (e) {}
}
function tone(f, delay, dur, type, vol){
  if (!soundOn || !actx) return;
  try {
    const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + 0.05);
  } catch (e) {}
}
const sTap     = () => tone(720, 0, .06, 'triangle', .12);
const sStart   = () => { tone(523, 0, .12, 'triangle', .22); tone(784, .12, .22, 'triangle', .22); };
const sCorrect = () => { tone(784, 0, .14, 'triangle', .25); tone(1046.5, .14, .18, 'triangle', .25); tone(1568, .3, .32, 'sine', .14); };
const sWrong   = () => { tone(311, 0, .2, 'square', .1); tone(233, .2, .36, 'square', .1); };
const sFanfare = () => { [523, 659, 784, 1046.5].forEach((f, i) => tone(f, i * .13, .2, 'triangle', .22)); tone(1318.5, .56, .6, 'triangle', .24); tone(659, .56, .6, 'sine', .12); };

   ========================================================= */
function stopSpeech(){ try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (e) {} }
function speak(text){
  try {
    if (!('speechSynthesis' in window)) return;
    const sy = window.speechSynthesis; sy.cancel();
    const u = new SpeechSynthesisUtterance(cleanSpeech(text));
    u.lang = 'ja-JP'; u.rate = S.lv === 'easy' ? 0.85 : 0.95;
    const v = sy.getVoices().find(x => /^ja/i.test(x.lang));
    if (v) u.voice = v;
    sy.speak(u);
  } catch (e) {}
}
function cleanSpeech(t){
  return String(t)
    .replace(/（[〇のし]+）/g, '')
    .replace(/ha（ヘクタール）/g, 'ヘクタール').replace(/ha/g, 'ヘクタール')
    .replace(/㎡（平方メートル）/g, '平方メートル').replace(/㎡/g, '平方メートル')
    .replace(/(\d)m(?![a-zA-Z])/g, '$1メートル')
    .replace(/(\d|ル)\s*×\s*/g, '$1かける').replace(/(\d)\s*÷\s*/g, '$1わる')
    .replace(/√/g, 'ルート').replace(/≒/g, 'やく').replace(/ − /g, 'ひく').replace(/＝/g, 'は')
    .replace(/【？】/g, 'なに').replace(/○/g, 'まる').replace(/×/g, 'ばつ')
    .replace(/——/g, '、');
}
function questionSpeech(q){
  let t = yomi(q.q);
  if (q.type === 'ox') t += '。まる？ ばつ？';
  if (q.c) t += '。' + q.order.map((i, k) => (k + 1) + '、' + yomi(q.c[i])).join('。');
  if (q.type === 'order') t += '。' + q.stepOrder.map(i => yomi(q.steps[i])).join('。');
  return t;
}

function goBtn(label){ const b = el('button', 'go-btn press'); b.type = 'button'; b.textContent = label; return b; }
function subBtn(label){ const b = el('button', 'sub-btn press'); b.type = 'button'; b.textContent = label; return b; }
function reveal(b){ if (!b.disabled) try { b.scrollIntoView({block:'nearest', behavior: reduceMotion() ? 'auto' : 'smooth'}); } catch (e) {} }
function ctrls(btns){ const d = el('div', 'ctrls'); btns.forEach(b => d.appendChild(b)); return d; }
function markOpt(o, kind){ o.classList.add(kind); const m = o.querySelector('.mark'); if (m) m.innerHTML = kind === 'ok' ? I.check : I.cross; }
function optButton(cls, inner){ const b = el('button', 'opt press' + (cls ? ' ' + cls : '')); b.type = 'button'; b.innerHTML = inner + '<span class="mark" aria-hidden="true"></span>'; return b; }

function renderOX(q, area){
  const wrap = el('div', 'ox');

function choiceInner(q, i){ return (q.sw ? '<span class="sw" style="background:' + q.sw[i] + '" aria-hidden="true"></span>' : '') + '<span>' + R(q.c[i]) + '</span>'; }
function renderChoice(q, area){

function renderMulti(q, area){
  const sel = new Set();
  const g = el('div', 'grid c2 multi');
  const go = goBtn(T('けってい', '決定')); go.disabled = true;
  q.order.forEach(i => {
    const b = optButton('', '<span class="chk" aria-hidden="true">' + I.check + '</span><span>' + R(q.c[i]) + '</span>');
    b.dataset.i = String(i); b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', () => {
      if (S.answered) return; sTap();
      if (sel.has(i)){ sel.delete(i); b.classList.remove('sel'); } else { sel.add(i); b.classList.add('sel'); }
      b.setAttribute('aria-pressed', String(sel.has(i)));
      go.disabled = sel.size === 0;
      if (sel.size === 1) reveal(go);
    });
    g.appendChild(b);
  });
  go.addEventListener('click', () => {
    if (S.answered || sel.size === 0) return;
    const ans = new Set(q.a);
    const ok = sel.size === ans.size && [...sel].every(x => ans.has(x));
    [...g.children].forEach(o => {
      const i = +o.dataset.i; o.disabled = true; o.classList.remove('sel');
      if (ans.has(i)) markOpt(o, 'ok'); else if (sel.has(i)) markOpt(o, 'ng'); else o.classList.add('dim');
    });
    go.disabled = true; finish(ok);
  });
  area.appendChild(g); area.appendChild(ctrls([go]));
}

function renderAnagram(q, area){
  const n = q.tiles.length, picked = [];
  const slots = el('div', 'slots' + (n > 8 ? ' many' : '')), tiles = el('div', 'tiles' + (n > 8 ? ' many' : ''));
  for (let k = 0; k < n; k++){
    const s = el('button', 'slot'); s.type = 'button'; s.setAttribute('aria-label', (k + 1) + 'もじめ');
    s.addEventListener('click', () => { if (S.answered || k >= picked.length) return; picked.splice(k, 1); sTap(); update(); });
    slots.appendChild(s);
  }
  q.tileOrder.forEach(ti => {
    const t = el('button', 'tile press'); t.type = 'button'; t.textContent = q.tiles[ti]; t.dataset.ti = String(ti);
    t.addEventListener('click', () => { if (S.answered || picked.length >= n || picked.indexOf(ti) >= 0) return; picked.push(ti); sTap(); update(); });
    tiles.appendChild(t);
  });
  const back = subBtn(T('ひとつ もどす', '1つ戻す')), clr = subBtn(T('やりなおす', 'やり直す')), go = goBtn(T('けってい', '決定'));
  back.addEventListener('click', () => { if (S.answered) return; picked.pop(); update(); });
  clr.addEventListener('click', () => { if (S.answered) return; picked.length = 0; update(); });
  go.addEventListener('click', () => {
    if (S.answered || picked.length < n) return;
    const ok = picked.map(i => q.tiles[i]).join('') === q.tiles.join('');
    slots.classList.add(ok ? 'ok' : 'ng');
    [back, clr, go].forEach(b => b.disabled = true);
    tiles.querySelectorAll('.tile').forEach(t => t.disabled = true);
    slots.querySelectorAll('.slot').forEach(s => s.disabled = true);
    finish(ok);
  });
  function update(){
    [...slots.children].forEach((s, k) => { const has = k < picked.length; s.textContent = has ? q.tiles[picked[k]] : ''; s.classList.toggle('filled', has); });
    [...tiles.children].forEach(t => t.classList.toggle('used', picked.indexOf(+t.dataset.ti) >= 0));
    go.disabled = picked.length < n; back.disabled = picked.length === 0; clr.disabled = picked.length === 0;
    if (picked.length === n) reveal(go);
  }
  area.appendChild(slots); area.appendChild(tiles); area.appendChild(ctrls([back, clr, go])); update();
}

function renderOrder(q, area){
  const n = q.steps.length, picked = [];
  const g = el('div', 'grid order ' + (n === 3 ? 'c3' : 'c2'));
  q.stepOrder.forEach(si => {
    const b = optButton('', '<span class="badge" aria-hidden="true"></span><span>' + R(q.steps[si]) + '</span>');
    b.dataset.si = String(si);
    b.addEventListener('click', () => {
      if (S.answered) return; sTap();
      const p = picked.indexOf(si);
      if (p >= 0) picked.splice(p, 1); else picked.push(si);
      update();
    });
    g.appendChild(b);
  });
  const clr = subBtn(T('やりなおす', 'やり直す')), go = goBtn(T('けってい', '決定'));
  clr.addEventListener('click', () => { if (S.answered) return; picked.length = 0; update(); });
  go.addEventListener('click', () => {
    if (S.answered || picked.length < n) return;
    const ok = picked.every((si, k) => si === k);
    [...g.children].forEach(b => {
      const si = +b.dataset.si; b.disabled = true; b.classList.remove('sel');
      markOpt(b, picked.indexOf(si) === si ? 'ok' : 'ng');
    });
    clr.disabled = true; go.disabled = true; finish(ok);
  });
  function update(){
    [...g.children].forEach(b => {
      const p = picked.indexOf(+b.dataset.si);
      b.classList.toggle('sel', p >= 0);
      b.querySelector('.badge').textContent = p >= 0 ? String(p + 1) : '';
    });
    go.disabled = picked.length < n; clr.disabled = picked.length === 0;
    if (picked.length === n) reveal(go);
  }
  area.appendChild(g); area.appendChild(ctrls([clr, go])); update();
}

function renderNumber(q, area){
  let v = '';
  const wrap = el('div', 'numwrap'), left = el('div', 'numleft'), disp = el('div', 'numdisp'), kp = el('div', 'keypad');
  disp.setAttribute('aria-live', 'polite');

  else { S.combo = 0; sWrong(); const c = $('#qcard'); c.classList.remove('enter', 'shake'); void c.offsetWidth; c.classList.add('shake'); }

}
function answerHTML(q, inline){
  const sep = inline ? '／' : '<br>';
  switch (q.type){
    case 'ox': return q.a ? '○（まる）' : '×（ばつ）';
    case 'choice': case 'fill': return R(q.c[q.a]);
    case 'multi': return q.a.map(i => R(q.c[i])).join(sep);
    case 'anagram': return q.tiles.join('');
    case 'order': return inline ? q.steps.map(s => R(s)).join(' → ') : q.steps.map((s, i) => (i + 1) + '. ' + R(s)).join('<br>');
    case 'number': return fmtNum(q.a) + q.unit;
  }
  return '';
}
function answerSpeech(q){
  switch (q.type){
    case 'ox': return q.a ? 'まる' : 'ばつ';
    case 'choice': case 'fill': return yomi(q.c[q.a]);
    case 'multi': return q.a.map(i => yomi(q.c[i])).join('、');
    case 'anagram': return q.tiles.join('');
    case 'order': return q.steps.map(s => yomi(s)).join('、');
    case 'number': return q.a + q.unit;
  }
  return '';
}

  {icon:'lotusRoot', title:'{琉球蓮根|りゅうきゅうれんこん}', text:'{白|しろ}い！ おいしい！ {育|そだ}つ{力|ちから}が すごい！ わき{水|みず}が{育|そだ}てる、あたらしい じまん。', ask:'しらべてみよう：どんな{料理|りょうり}に あうかな？'}
];
function showResult(){
  recordPlay(S.lv, S.score);
  showScreen('result');
  const f = $('#field');
  f.innerHTML = S.results.map((r, i) => '<div class="plot">' + plotSVG(r.ok ? plantKind(i) : 'mud') + '</div>').join('');
  if (!reduceMotion()){
    [...f.children].forEach((p, i) => { const pl = p.querySelector('.plant, .mudfill'); if (pl) pl.style.animationDelay = (0.25 + i * 0.12) + 's'; p.classList.add('grow'); });
  }
  $('#fieldLabel').innerHTML = R(T('きみが そだてた たんぼ', 'あなたが育てた{田|た}んぼ'));
  $('#resMascot').innerHTML = mascot(S.score >= 6 ? 'happy' : 'smile');
  const total = S.qs.length;
  const scoreHTML = (n) => '<b>' + n + '</b> / ' + total + T(' もん', '問');
  const sc = $('#score');
  if (reduceMotion()) sc.innerHTML = scoreHTML(S.score);
  else { let k = 0; sc.innerHTML = scoreHTML(0); const tick = setInterval(() => { k++; if (k > S.score){ clearInterval(tick); return; } sc.innerHTML = scoreHTML(k); }, Math.max(60, 700 / Math.max(1, S.score))); }
  const stars = S.score >= 9 ? 3 : S.score >= 6 ? 2 : S.score >= 3 ? 1 : 0;
  $('#stars').innerHTML = [0,1,2].map(i => I.star(i < stars)).join('');
  $('#stars').setAttribute('aria-label', 'ほし ' + stars + 'こ');
  $('#rank').innerHTML = Rk(rankFor(S.score));
  $('#resMsg').innerHTML = R(messageFor(S.score));
  $('#againBtn').textContent = T('もういちど あそぶ', 'もう一度あそぶ');
  $('#levelBtn').textContent = T('レベルを えらぶ', 'レベルを選ぶ');
  $('#jimanHead').innerHTML = Rk('「{宜野湾|ぎのわん}のじまん」、{見|み}つかった？');
  $('#jimanSub').innerHTML = Rk('はっぴょうの テーマに なりそうな たからものだよ');
  $('#jimanCards').innerHTML = JIMAN.map(j => '<article class="card jcard"><div class="ji">' + I[j.icon] + '</div><h3>' + Rk(j.title) + '</h3><p>' + Rk(j.text) + '</p><p class="ask">' + Rk(j.ask) + '</p></article>').join('');
  $('#reviewHead').innerHTML = Rk('ふりかえり');
  $('#reviewSub').innerHTML = Rk('こたえを たしかめて、もう いちど チャレンジしよう');
  $('#reviewList').innerHTML = S.results.map((r, i) =>
    '<li class="' + (r.ok ? 'ok' : 'ng') + '"><span class="rv-mark" role="img" aria-label="' + (r.ok ? 'せいかい' : 'ふせいかい') + '">' + (r.ok ? I.check : I.cross) + '</span><div>'
    + '<p class="rv-q">' + (i + 1) + '. ' + R(r.q.q).replace('【？】', '（　　）') + '</p>'
    + '<p class="rv-a">' + T('こたえ', '答え') + '：<b>' + answerHTML(r.q, true) + '</b></p></div></li>').join('');
  $('#idleNote').textContent = 'しばらく さわらないと、さいしょの がめんに もどります';
  sFanfare();
  if (S.score >= 6) confetti();
}
const BITS = [
  '<svg viewBox="0 0 16 20"><path d="M8 1.5C8 1.5 2 9 2 12.6A6 6 0 0 0 14 12.6C14 9 8 1.5 8 1.5Z" fill="#8FD8F6" stroke="#1E2B44" stroke-width="1.6"/></svg>',
  '<svg viewBox="0 0 20 14"><path d="M1 7 C5 0 15 0 19 7 C15 14 5 14 1 7Z" fill="#3BA55C" stroke="#1E2B44" stroke-width="1.6"/></svg>',
  '<svg viewBox="0 0 14 20"><path d="M7 19 C-1 12 2 3 7 1 C12 3 15 12 7 19Z" fill="#EF5C8E" stroke="#1E2B44" stroke-width="1.6"/></svg>',
  '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5" fill="#FFC83A" stroke="#1E2B44" stroke-width="1.6"/></svg>'
];
function clearConfetti(){ document.querySelectorAll('.confetti').forEach(c => c.remove()); }
function confetti(){
  if (reduceMotion()) return;
  for (let i = 0; i < 40; i++){
    const s = el('span', 'confetti'); s.innerHTML = BITS[i % BITS.length];
    const size = 16 + Math.random() * 16;
    s.style.left = (Math.random() * 100) + 'vw'; s.style.width = size + 'px'; s.style.height = size + 'px';
    s.style.animationDuration = (2.4 + Math.random() * 1.8) + 's';
    s.style.animationDelay = (Math.random() * .7) + 's';
    document.body.appendChild(s); setTimeout(() => s.remove(), 5500);
  }
}

/* =========================================================
   放置対策（イベント用）
   結果画面 90秒 → タイトルへ / クイズ中 3分 → 確認してタイトルへ
   ========================================================= */
let idleTimer = null, idleCountdown = null;
function resetIdle(){
  clearTimeout(idleTimer);
  if (current === 'title') return;
  idleTimer = setTimeout(onIdle, current === 'result' ? 90000 : 180000);
}
function clearIdleCountdown(){ clearInterval(idleCountdown); idleCountdown = null; }
function onIdle(){
  if (current === 'result'){ goTitle(); return; }
  if (current !== 'quiz') return;
  let n = 15;
  openModal({
    title: Rk('まだ あそぶ？'),
    body: '<p id="idleCount">' + n + ' びょうで さいしょの がめんに もどるよ</p>',
    buttons: [{label:'つづける', cls:'go-btn press', onClick: () => { clearIdleCountdown(); closeModal(); resetIdle(); }},
              {label:'おわる', cls:'sub-btn press', onClick: () => goTitle()}]
  });
  clearIdleCountdown();
  idleCountdown = setInterval(() => {
    n--; const c = document.getElementById('idleCount'); if (c) c.textContent = n + ' びょうで さいしょの がめんに もどるよ';
    if (n <= 0){ clearIdleCountdown(); goTitle(); }
  }, 1000);
}

/* =========================================================
   モーダル
   ========================================================= */
function openModal(o){
  $('#modalTitle').innerHTML = o.title;
  $('#modalBody').innerHTML = o.body || '';
  const btns = $('#modalBtns'); btns.innerHTML = '';
  (o.buttons || []).forEach(b => { const x = el('button', b.cls || 'sub-btn press'); x.type = 'button'; x.innerHTML = b.label; x.addEventListener('click', b.onClick); btns.appendChild(x); });
  $('#modal').hidden = false;
}
function closeModal(){ $('#modal').hidden = true; }

/* =========================================================
   スタッフ用：プレイ記録（この端末の中だけに保存）
   タイトル上部の「第37回 宜野湾市産業まつり」を3秒長おしで表示
   ========================================================= */
const STORE_KEY = 'ginowanJimanQuiz_stats_v1';
function loadStats(){ try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { return {}; } }
function saveStats(s){ try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch (e) {} }
function todayStr(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function recordPlay(lv, score){
  const s = loadStats(), d = todayStr();
  s[d] = s[d] || {};
  const r = s[d][lv] || {plays:0, sum:0, perfect:0};
  r.plays++; r.sum += score; if (score === QUESTIONS_PER_GAME) r.perfect++;
  s[d][lv] = r; saveStats(s);
}
function statsHTML(){
  const s = loadStats(), dates = Object.keys(s).sort().reverse(), lvs = ['easy', 'normal', 'hard', 'oni'];
  if (!dates.length) return '<p>まだ記録がありません。</p>';
  const cell = (r) => r ? r.plays + '回<small>平均 ' + (r.sum / r.plays).toFixed(1) + '点・満点 ' + r.perfect + '</small>' : '—';
  let html = '<table class="stats"><thead><tr><th>日付</th><th>かんたん</th><th>ふつう</th><th>むずかしい</th><th>鬼</th><th>合計</th></tr></thead><tbody>';
  dates.forEach(d => {
    const tot = lvs.reduce((a, l) => a + ((s[d][l] && s[d][l].plays) || 0), 0);
    html += '<tr><td>' + d.slice(5).replace('-', '/') + '</td>' + lvs.map(l => '<td>' + cell(s[d][l]) + '</td>').join('') + '<td><b>' + tot + '回</b></td></tr>';
  });
  return html + '</tbody></table><p class="stats-note">このiPadのブラウザの中だけに保存されています（「履歴とWebサイトデータを消去」で消えます）。</p>';
}
function openStats(){
  openModal({
    title:'スタッフ用：プレイ記録', body: statsHTML(),
    buttons:[{label:'とじる', cls:'go-btn press', onClick: closeModal},
             {label:'記録をリセット', cls:'sub-btn press', onClick: () => openModal({
                title:'記録をすべて消しますか？', body:'<p>この操作は元に戻せません。</p>',
                buttons:[{label:'やめる', cls:'go-btn press', onClick: openStats},
                         {label:'消す', cls:'sub-btn press', onClick: () => { try { localStorage.removeItem(STORE_KEY); } catch (e) {} openStats(); }}]})}]
  });
}
(function setupStaffPress(){
  const r = $('#ribbon'); let t = null;
  const cancel = () => { clearTimeout(t); t = null; };
  r.addEventListener('pointerdown', () => { cancel(); t = setTimeout(openStats, 3000); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => r.addEventListener(ev, cancel));
})();

/* =========================================================
   起動
   ========================================================= */
$('#nextBtn').addEventListener('click', next);
$('#readBtn').addEventListener('click', () => { const q = S.qs[S.idx]; if (q) speak(questionSpeech(q)); });
$('#sheetRead').addEventListener('click', () => {
  const q = S.qs[S.idx]; if (!q) return;
  const ok = $('#sheet').dataset.ok === '1';
  speak((ok ? 'せいかい。' : 'ざんねん。') + 'こたえは、' + answerSpeech(q) + '。' + yomi(q.exp));
});
$('#quitBtn').addEventListener('click', () => {
  openModal({title: Rk('クイズを やめて、さいしょに もどる？'), body:'',
    buttons:[{label:'つづける', cls:'go-btn press', onClick: closeModal}, {label:'やめる', cls:'sub-btn press', onClick: goTitle}]});
});
$('#againBtn').addEventListener('click', () => startGame(S.lv || 'easy'));
$('#levelBtn').addEventListener('click', goTitle);
document.querySelectorAll('.snd-btn').forEach(b => b.addEventListener('click', () => { ensureAudio(); setSound(!soundOn); if (soundOn) sTap(); }));
document.addEventListener('pointerdown', () => { ensureAudio(); resetIdle(); }, {passive:true});
document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('contextmenu', (e) => e.preventDefault());
if ('speechSynthesis' in window){ try { window.speechSynthesis.getVoices(); window.speechSynthesis.onvoiceschanged = () => {}; } catch (e) {} }
else { $('#readBtn').classList.add('hidden'); $('#sheetRead').classList.add('hidden'); }

$('#heroMascot').innerHTML = mascot('happy');
buildLevels();
setSound(soundOn);
playHero();
</script>
